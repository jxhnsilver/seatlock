services:
  seating-api:
    build:
      context: .
      dockerfile: ./src/Seating.Api/Dockerfile
    image: seating-api:local
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=seating-db;Port=5432;Database=${SEATING_DB_NAME};Username=${SEATING_DB_USER};Password=${SEATING_DB_PASSWORD}
    networks:
      - seating-network
      - services-network
    depends_on:
      seating-db:
        condition: service_healthy

  seating-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SEATING_DB_USER}
      POSTGRES_PASSWORD: ${SEATING_DB_PASSWORD}
      POSTGRES_DB: ${SEATING_DB_NAME}
    volumes:
      - seating-db-data:/var/lib/postgresql/data
    networks:
      - seating-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEATING_DB_USER} -d ${SEATING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  screenings-api:
    build:
      context: .
      dockerfile: ./src/Screenings.Api/Dockerfile
    image: screenings-api:local
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=screenings-db;Port=5432;Database=${SCREENINGS_DB_NAME};Username=${SCREENINGS_DB_USER};Password=${SCREENINGS_DB_PASSWORD}
      Services__SeatingApi__BaseUrl: http://seating-api:8080/
    networks:
      - screenings-network
      - services-network
    depends_on:
      screenings-db:
        condition: service_healthy

  screenings-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SCREENINGS_DB_USER}
      POSTGRES_PASSWORD: ${SCREENINGS_DB_PASSWORD}
      POSTGRES_DB: ${SCREENINGS_DB_NAME}
    volumes:
      - screenings-db-data:/var/lib/postgresql/data
    networks:
      - screenings-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCREENINGS_DB_USER} -d ${SCREENINGS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  seating-network:
  screenings-network:
  services-network:

volumes:
  seating-db-data:
  screenings-db-data:
